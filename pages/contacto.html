<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/styles.css" />

    <title>Contacto - PIT BOX Roadside Services</title>
  </head>
  <body>
    <header>
      <div class="div-logo">
        <a class="logo" href="../index.html">PIT<span>BOX</span></a>
      </div>

      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html">Contacto</a></li>
          <li><a href="./carrito.html">Carrito</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="contacto">
        <h1 class="titulo-contacto text-secondary">Contáctanos</h1>

        <form class="form-contacto" action="" method="POST">
          <div class="grupo-input">
            <label for="email">Correo electrónico:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>

          <div class="grupo-input">
            <label for="mensaje">En que puedes ayudarte?:</label>
            <textarea
              id="mensaje"
              name="mensaje"
              rows="4"
              placeholder="Escribe tu mensaje aquí..."
              required
            ></textarea>
          </div>
          <button type="submit" class="btm-enviar">Enviar Mensaje</button>
        </form>
      </section>
    </main>
    <footer>
      <p>Sitio realizado por K. Korzhova para PIT BOX Roadside Services</p>
      <nav>
        <ul class="footer-social-media">
          <li><img src="../img/facebook.png" alt="Facebook" /></li>
          <li><img src="../img/whatsapp.png" alt="WhatsApp" /></li>
          <li><img src="../img/instagram.png" alt="Instagram" /></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
